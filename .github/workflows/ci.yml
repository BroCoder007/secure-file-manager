name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install existing stack dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev python3 xvfb dbus-x11
      - name: Build CLI and GTK interface, run regression tests
        run: make -j2 check
      - name: Check memory and undefined behavior
        run: make sanitize
      - name: Exercise GTK workflows in a virtual display
        run: G_DEBUG=fatal-warnings NO_AT_BRIDGE=1 xvfb-run -a dbus-run-session -- make gui-test
